[project]
name = "harness-server"
version = "0.1.0"
description = "Harness backend: OTLP/HTTP trace ingest → ClickHouse, query API, UI host"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "clickhouse-connect[async]>=0.8.0",
    "opentelemetry-proto>=1.30.0",
    "protobuf>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "opentelemetry-sdk>=1.30.0",
       "opentelemetry-exporter-otlp-proto-http>=1.30.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
