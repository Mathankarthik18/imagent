[project]
name = "imagent"
version = "0.1.0"
description = "OpenTelemetry-native tracing, blueprints and experiments for LLM agents (LangChain/LangGraph/deepagents, OpenAI Agents SDK, LlamaIndex, CrewAI, OpenAI/Anthropic SDKs)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opentelemetry-api>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30.0",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3.0"]
# Each integration activates on its own when the framework is installed — these extras are optional.
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.40"]
openai-agents = ["openai-agents>=0.2"]
llamaindex = ["llama-index-core>=0.12"]
crewai = ["crewai>=0.100"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imagent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
