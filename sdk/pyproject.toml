[project]
name = "ai-harness-moni"
version = "0.1.0"
description = "OpenTelemetry-native tracing for LLM agents (LangChain / LangGraph / custom code)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opentelemetry-api>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30.0",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_moni"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
