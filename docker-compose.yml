name: imagent-monitor


services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: imagent
      CLICKHOUSE_USER: imagent
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-imagent}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 5s
      retries: 20

  imagent:
    build: .
    restart: unless-stopped
    depends_on:
      clickhouse: { condition: service_healthy }
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: imagent
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-imagent}
      IMAGENT_INGEST_KEY: ${IMAGENT_INGEST_KEY:-}
      IMAGENT_READ_KEY: ${IMAGENT_READ_KEY:-}
      IMAGENT_RETENTION_DAYS: ${IMAGENT_RETENTION_DAYS:-30}
      # AI judge for experiments (which answer is better). Off until a key is set — put it in ./.env.
      IMAGENT_JUDGE_API_KEY: ${IMAGENT_JUDGE_API_KEY:-}
      IMAGENT_JUDGE_MODEL: ${IMAGENT_JUDGE_MODEL:-anthropic/claude-sonnet-5.5}
      IMAGENT_JUDGE_BASE_URL: ${IMAGENT_JUDGE_BASE_URL:-https://openrouter.ai/api/v1}
    ports:
      # Local-only by default. A server that other machines send to sets IMAGENT_BIND=0.0.0.0
      # (and IMAGENT_READ_KEY) in ./.env — see deploy/server/README.md.
      - "${IMAGENT_BIND:-127.0.0.1}:8300:8300"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8300/api/health', timeout=3)"]
      interval: 15s
      retries: 5

volumes:
  clickhouse-data:
